# checks the project on github every time I push
# if something is broken, github shows a red x next to the commit instead of a green check

name: CI

# when this runs: on every push to main, and on pull requests into main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the image lives on GHCR, github's own place for docker images
# github only allows lowercase names there
env:
  IMAGE: ghcr.io/acimovicluka/atp-tennis-tracker

jobs:
  check:
    # github gives a fresh ubuntu machine for every run and throws it away after
    runs-on: ubuntu-latest

    # by default a workflow can only read the repo
    # packages: write lets it upload the image to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # downloads my repo onto that machine, without this it would be empty
      - name: Get the code
        uses: actions/checkout@v4

      # installs python, the same version as in the Dockerfile
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the same packages the docker image gets
      - name: Install packages
        run: pip install -r requirements.txt

      # imports both files without running them
      # this catches typos, missing imports and packages that don't install,
      # the kind of mistakes that would only show up once the container crashes
      # it doesn't need the database, both files only connect when they're actually used
      - name: Check that the code loads
        run: python -c "import api, fetcher"

      # builds the image the same way I do with docker build on my computer
      # if the Dockerfile is broken, this is where it shows
      # it gets two names: the commit it was made from, and latest
      # the label ties the image to this repo, so it shows up on the repo page
      - name: Build the docker image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            .

      # logs docker into GHCR with a key github makes for this run only, so no password of mine is needed
      # only on a push to main, a pull request only gets checked and never uploads anything
      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # uploads both names of the image to GHCR
      - name: Push the image to GHCR
        if: github.event_name == 'push'
        run: docker push --all-tags $IMAGE
