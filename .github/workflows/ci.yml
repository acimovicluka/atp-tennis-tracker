# the CI workflow checks the project on github every time I push
# it runs the tests, builds the docker image and uploads it to GHCR, where the server pulls it from
# if something is broken, github shows a red x next to the commit instead of a green check,
# and the badge at the top of the README shows the same

name: CI

# when github runs this: on every push to main, and on pull requests into main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the image lives on GHCR, github's own registry for docker images
# github only allows lowercase names there
env:
  IMAGE: ghcr.io/acimovicluka/atp-tennis-tracker

jobs:
  check:
    # github gives a fresh ubuntu machine for every run and throws it away after
    runs-on: ubuntu-latest

    # by default a workflow can only read the repo
    # packages: write lets this workflow upload the image to GHCR
    permissions:
      contents: read
      packages: write

    # services start an empty postgres just for the tests, github runs it next to the machine and throws it away after
    # it's the same idea as the db service in docker-compose.yml
    # the password here is not a secret, this database only lives for a few minutes and only holds made up data
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tennis_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # github waits until postgres is ready before the steps start, like the healthcheck in docker-compose.yml
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # downloads my repo onto that machine, without this it would be empty
      - name: Get the code
        uses: actions/checkout@v5

      # installs python, the same version as in the Dockerfile
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # the same packages the docker image gets, plus pytest for the tests
      - name: Install packages
        run: pip install -r requirements-dev.txt

      # pytest runs everything in the tests folder against the test database above
      # conftest.py fills the database with tests/seed.sql, and the tests check that every endpoint gives the right answer
      # if one test fails, the run stops here, and github never builds or uploads a broken image
      # python -m pytest instead of just pytest, so python can find api.py and fetcher.py in the main folder
      - name: Run the tests
        run: python -m pytest -v
        env:
          DB_HOST: localhost
          DB_NAME: tennis_test
          DB_USER: postgres
          DB_PASSWORD: test

      # github builds the image the same way I do with docker build on my computer
      # if the Dockerfile is broken, this is where it shows
      # the image gets two names (tags): the commit it was made from, and latest
      # the label ties the image to this repo, so it shows up on the repo page
      - name: Build the docker image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            .

      # logs docker into GHCR with a token github makes only for this run (GITHUB_TOKEN), so no password of mine is needed
      # this only happens on a push to main, a pull request only gets checked and never uploads anything
      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # uploads both names of the image to GHCR, and k3s on the server pulls latest from there
      - name: Push the image to GHCR
        if: github.event_name == 'push'
        run: docker push --all-tags $IMAGE
