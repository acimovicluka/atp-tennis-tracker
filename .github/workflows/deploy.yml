# the Deploy workflow (CD) updates the aws server with the newest code from github
# it does the same thing I do with ansible-playbook from wsl, only github runs it on its own machine
# it doesn't run on every push, because the server isn't always on
# it runs when I press "Run workflow" on the Actions tab and type in the server ip (workflow_dispatch)

name: Deploy

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: "Public ip of the server, from terraform output public_ip"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest   # github gives a fresh ubuntu machine for this run and throws it away after

    steps:
      # downloads my repo onto that machine, the playbook and the inventory template are in it
      - name: Get the code
        uses: actions/checkout@v5

      # the playbook only uses ansible's built in modules, so the small ansible-core is enough
      - name: Install ansible
        run: pip install ansible-core

      # github takes the private ssh key from the repo secrets, and hides it in the logs
      # ssh refuses a key that other users can read, so chmod 600, the same as I did in wsl
      - name: Set up the ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ATP_SSH_KEY }}" > ~/.ssh/atp-tracker
          chmod 600 ~/.ssh/atp-tracker

      # the playbook reads the database password from .env next to docker-compose.yml
      # .env isn't on github, so this step makes one from the repo secrets, only for this run
      - name: Write .env
        run: echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env

      # on my computer terraform writes inventory.ini, here the workflow makes it from the same template
      # sed swaps ${ip} in the template for the ip I typed in when I started the workflow
      - name: Write the inventory
        run: sed 's/${ip}/${{ inputs.server_ip }}/' terraform/inventory.tftpl > ansible/inventory.ini

      # the same command I run from wsl, ansible logs into the server over ssh and sets everything up
      - name: Run the playbook
        working-directory: ansible
        run: ansible-playbook -i inventory.ini playbook.yml
