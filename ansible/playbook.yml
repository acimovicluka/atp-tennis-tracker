# everything ansible does on the aws server, step by step from top to bottom
# run it from wsl with: ansible-playbook -i inventory.ini playbook.yml
# it's safe to run again, steps that are already done just get skipped
# the project runs on kubernetes (k3s) here, with the same manifests from k8s/ that I use on docker desktop

- name: Set up the ATP tennis tracker server
  hosts: atp       # the group from inventory.ini
  become: true     # run everything with sudo, installing things needs root

  # values used further down, kept up here so they're easy to change
  vars:
    repo_url: https://github.com/acimovicluka/atp-tennis-tracker.git
    project_dir: /home/ubuntu/atp-tennis-tracker
    # the database password is read from my own .env, the one next to docker-compose.yml on my computer
    # that file never goes to github, so the password never ends up in this playbook either
    db_password: "{{ lookup('ansible.builtin.ini', 'DB_PASSWORD', type='properties', file=playbook_dir + '/../.env') | trim }}"

  tasks:

    # the server has 2 GB of ram and no swap at all
    # swap is a piece of the disk used as extra ram when the real one runs out
    # without it kubernetes, postgres and building the docker image can run out of memory

    # makes an empty 2 GB file that will become the swap
    # "creates" means skip this if /swapfile is already there
    - name: Make a 2 GB swap file
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    # only root should be able to read it, swap can hold bits of anything that was in memory
    - name: Only root can read the swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    # turns the file into swap and switches it on
    # only runs when the server has no swap yet, so a second run doesn't break anything
    - name: Turn on the swap
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      when: ansible_facts['swaptotal_mb'] == 0

    # /etc/fstab is the list of things linux switches on at boot
    # without this line the swap would be gone after a restart
    - name: Keep the swap on after a restart
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

    # docker
    # kubernetes doesn't build images, so docker is still needed to build atp-tracker:1 from the Dockerfile
    # docker.io is docker itself, docker-buildx is what builds images, and git is for cloning the project
    # update_cache is the same as running apt update first
    - name: Install docker and git
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-buildx
          - git
        state: present
        update_cache: true

    # makes sure docker is running now and starts by itself after a restart
    - name: Start docker and keep it on after a restart
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # adds the ubuntu user to the docker group
    # this way I can run docker commands over ssh without typing sudo every time
    # append keeps the groups ubuntu is already in, otherwise it would lose them
    - name: Let the ubuntu user run docker without sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # the project
    # downloads the repo from github into /home/ubuntu/atp-tennis-tracker
    # the first run clones it, every run after that pulls whatever is new on github
    # become: false runs this one as ubuntu instead of root, so the files belong to ubuntu
    - name: Download the project from github
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: main
      become: false

    # kubernetes
    # k3s is a small kubernetes made for a single server, it installs with one script
    # traefik is a web router k3s ships with, we don't need it and it would only eat ram
    # "creates" skips this when k3s is already installed
    - name: Install k3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
      args:
        creates: /usr/local/bin/k3s

    # waits until kubernetes says the server is ready to run pods, at most 2 minutes
    # k3s kubectl is the same kubectl I use on my computer, it just comes built into k3s
    - name: Wait for kubernetes to be ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
      changed_when: false

    # the image
    # same command as on my computer, the newest code from github goes into atp-tracker:1
    - name: Build the image
      ansible.builtin.command: docker build -t atp-tracker:1 .
      args:
        chdir: "{{ project_dir }}"

    # k3s has its own image storage and can't see the images docker made
    # docker save packs the image into one file and k3s ctr images import unpacks it into k3s
    - name: Hand the image over to k3s
      ansible.builtin.shell: docker save atp-tracker:1 | k3s ctr images import -

    # the secret
    # same as k8s/secret.yaml on my computer, with the password read from my .env
    # it's written into the project folder on the server, where git never sees it
    # no_log stops ansible from printing the password in the output
    - name: Write the kubernetes secret
      ansible.builtin.copy:
        dest: "{{ project_dir }}/k8s/secret.yaml"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: atp-db
          type: Opaque
          stringData:
            DB_NAME: tennis
            DB_USER: postgres
            DB_PASSWORD: "{{ db_password }}"
        mode: "0600"
      no_log: true

    # schema.sql as a configmap, so postgres can make the tables
    # on my computer I ran kubectl create configmap once by hand
    # here --dry-run only writes the configmap out and apply sends it, so running it again doesn't fail
    - name: Put schema.sql into kubernetes
      ansible.builtin.shell: k3s kubectl create configmap atp-schema --from-file=schema.sql --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        chdir: "{{ project_dir }}"

    # the same command as on my computer, everything from the k8s folder
    - name: Start the project on kubernetes
      ansible.builtin.command: k3s kubectl apply -f k8s/
      args:
        chdir: "{{ project_dir }}"

    # the image name stays atp-tracker:1 even when the code inside changes,
    # so kubernetes wouldn't notice anything new on its own
    # rollout restart swaps the api pod for a new one with the new image, without the api going down
    - name: Restart the api so it uses the new image
      ansible.builtin.command: k3s kubectl rollout restart deployment/api

    # runs the fetcher once right now instead of waiting for 6:00 tomorrow
    # the epoch at the end makes the name different every time, two jobs can't have the same name
    - name: Run the fetcher once right now
      ansible.builtin.command: k3s kubectl create job --from=cronjob/fetcher fetcher-ansible-{{ ansible_facts['date_time']['epoch'] }}
