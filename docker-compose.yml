# docker-compose.yml describes the whole project in one file: the database, the fetcher and the api
# with one command (docker compose up -d) compose starts all three, in the right order, on one shared network
# this is the quick way to run the project on my computer, grafana and prometheus only exist in k8s/
#
# compose reads the settings from the .env file next to this one
# ${DB_NAME:-tennis} means: take DB_NAME from .env, and if it isn't there use tennis
# the password has no default on purpose: ${DB_PASSWORD:?...} stops compose with that message if DB_PASSWORD is missing

# the project name, docker puts it in front of every container, volume and network name (atp-tennis-tracker-api-1...)
name: atp-tennis-tracker

services:

  # the postgres database, it uses the official image so there's nothing to build
  db:
    image: postgres:16
    environment:
      # postgres creates the database and the user from these the very first time it starts
      POSTGRES_DB: ${DB_NAME:-tennis}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?put DB_PASSWORD in the .env file}
    volumes:
      # the data lives in a named volume, so it's still there after compose removes the container
      - db-data:/var/lib/postgresql/data
      # postgres runs every sql file from this folder on its very first start, so it makes the tables from schema.sql by itself
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # every 5 seconds docker asks postgres (with pg_isready) if it's ready to take connections
      # the fetcher and the api wait for a yes before they start
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-postgres} -d ${DB_NAME:-tennis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped   # if the container crashes or docker restarts, docker brings it back up by itself
    # there are no ports here on purpose, so nobody outside docker can reach the database
    # only the fetcher and the api talk to it, and they find it on docker's own network by the name "db"

  # the fetcher downloads all the csv files from TML, fills the database and then stops
  fetcher:
    build: .   # compose builds the image from the Dockerfile in this folder
    command: ["python", "fetcher.py"]   # the same image as the api, compose only swaps the command
    environment:
      DB_HOST: db   # inside a container localhost is the container itself, so the fetcher reaches the database by the service name "db"
      DB_NAME: ${DB_NAME:-tennis}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?put DB_PASSWORD in the .env file}
    depends_on:
      db:
        condition: service_healthy   # compose doesn't start the fetcher until the healthcheck above says yes

  # the api, it stays up the whole time
  api:
    build: .
    # there's no command here, so the container runs the CMD from the Dockerfile, which is uvicorn
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-tennis}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?put DB_PASSWORD in the .env file}
    ports:
      # this connects a port on my computer (left) to the port inside the container (right)
      # so http://localhost:8000 on my computer reaches uvicorn inside the container
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# the named volume for the database data, docker keeps it until I delete it myself (docker compose down -v)
volumes:
  db-data:
