# the api, the kubernetes version of the api service in docker-compose.yml
# a Deployment keeps the api running, and a Service lets the browser reach it

# a Deployment tells kubernetes "there should always be this many api pods running"
# if the pod crashes or stops answering, kubernetes makes a new one by itself
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1                  # how many copies of the api run at the same time
  selector:
    matchLabels:
      app: api
  template:                    # the pod this Deployment makes
    metadata:
      labels:
        app: api               # the label the Service below looks for
    spec:
      # kubernetes normally puts environment variables for every Service into every pod
      # for the db Service one of them is DB_PORT=tcp://10.x.x.x:5432, and that breaks int(os.getenv("DB_PORT")) in db.py
      # this switches that off, so DB_PORT stays unset and db.py uses its default 5432
      enableServiceLinks: false
      containers:
        - name: api
          image: ghcr.io/acimovicluka/atp-tennis-tracker:latest   # the image github actions builds on every push, the fetcher uses the same one
          imagePullPolicy: Always        # every time a pod starts, kubernetes checks GHCR for a newer latest
          ports:
            - containerPort: 8000
          # the same settings as in compose, and the database is the "db" Service
          env:
            - name: DB_HOST
              value: db
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_PASSWORD
          # kubernetes checks the api in two different ways
          # readiness probe: kubernetes calls /ready every 5 seconds, and until it answers
          # (meaning the api can reach the database) kubernetes sends no traffic to this pod
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          # liveness probe: if /ping stops answering three times in a row, kubernetes restarts the pod
          # it uses /ping and not /ready, because a database outage shouldn't make kubernetes restart a healthy api over and over
          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
# the Service is the address of the api
# type LoadBalancer makes it reachable from outside the cluster
# on k3s (aws) that's http://<ip>:8000, on docker desktop it stays <pending>, so there I use kubectl port-forward
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 8000          # the port the Service opens to the outside
      targetPort: 8000    # the port inside the pod, where uvicorn listens
