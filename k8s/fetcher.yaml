# the fetcher, the kubernetes version of the fetcher service in docker-compose.yml
# in compose it runs once, when I type docker compose up
# here a CronJob starts it by itself every morning, so the database is never out of date
# for the very first fill I start it by hand: kubectl create job --from=cronjob/fetcher fetcher-first

apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetcher
spec:
  schedule: "0 6 * * *"          # cron format, minute hour day month weekday, so every day at 6:00
  timeZone: "Europe/Belgrade"    # 6:00 my time, not 6:00 utc
  concurrencyPolicy: Forbid      # if yesterday's run is somehow still going, kubernetes doesn't start a second one
  successfulJobsHistoryLimit: 3  # kubernetes keeps the last 3 runs, so I can still read their logs
  failedJobsHistoryLimit: 3
  jobTemplate:                   # every day the CronJob makes a Job from this, and the Job makes a pod
    spec:
      backoffLimit: 4            # if the fetcher fails, kubernetes tries again up to 4 times, for example when the database isn't up yet
      ttlSecondsAfterFinished: 86400   # kubernetes cleans up finished runs after a day, the ones I start by hand too
      template:
        spec:
          restartPolicy: OnFailure   # restart only when it fails, a fetcher that finished should stay finished
          # same as in api.yaml, it stops kubernetes from putting DB_PORT=tcp://... into the pod
          enableServiceLinks: false
          containers:
            - name: fetcher
              image: ghcr.io/acimovicluka/atp-tennis-tracker:latest   # the same image as the api, from GHCR
              imagePullPolicy: Always    # so every morning's run gets the newest image
              command: ["python", "fetcher.py"]   # the image starts the api by default, this swaps it for the fetcher
              env:
                - name: DB_HOST
                  value: db
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: atp-db
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: atp-db
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: atp-db
                      key: DB_PASSWORD
