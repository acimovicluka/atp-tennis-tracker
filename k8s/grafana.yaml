          {
            "type": "query",
            "name": "opponent",
            "label": "Opponent",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "atp-postgres"
            },
            "query": "SELECT player_id AS __value, name AS __text FROM players ORDER BY name",
            "definition": "SELECT player_id AS __value, name AS __text FROM players ORDER BY name",
            "refresh": 1,
            "current": {
              "text": "Carlos Alcaraz",
              "value": "A0E2",
              "selected": true
            },
            "options": [],
