            "w": 24,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT m.tourney_date AS date, m.tourney_name AS tournament, m.surface, m.round, w.name AS winner, m.score FROM matches m JOIN players w ON w.player_id = m.winner_id WHERE (m.winner_id = '$player' AND m.loser_id = '$opponent') OR (m.winner_id = '$opponent' AND m.loser_id = '$player') ORDER BY m.tourney_date DESC, m.match_num DESC"
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ],
      "annotations": {
        "list": []
      }
    }
---
# runs grafana and keeps it running, the same way api.yaml runs the api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      enableServiceLinks: false   # same as in api.yaml, keeps kubernetes from adding DB_PORT=tcp://...
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - containerPort: 3000
          env:
            # anyone who opens the page can look at the charts without logging in, but can't change them
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # the players dashboard opens right away instead of grafana's welcome page
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/players.json
            # the admin login is admin with the database password, only needed to edit the dashboard
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_PASSWORD
            # used by datasources.yaml above to log into the database
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_PASSWORD
          # grafana has its own health address, same idea as /ping on the api
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            # the two provisioning files go where grafana looks for them
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/atp.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/atp.yaml
              subPath: dashboards.yaml
            # the dashboard json
            - name: dashboard
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
# the address of grafana, port 3000, the same way the api is on 8000
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
