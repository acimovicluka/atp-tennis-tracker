          "title": "Wins",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
