# grafana, a web page with charts for every player, read straight from the database
# pick a player from the dropdown at the top and every chart switches to him
# four things in this file, split by ---

# tells grafana where the database is and where to find the dashboard
# grafana reads these files by itself when it starts, this is called provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  # the database connection, same db Service as the api uses
  # $DB_USER, $DB_NAME and $DB_PASSWORD come from the atp-db secret through the env part of the Deployment
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: ATP database
        uid: atp-postgres
        type: grafana-postgresql-datasource
        url: db:5432
        user: $DB_USER
        isDefault: true
        jsonData:
          database: $DB_NAME
          sslmode: disable
          postgresVersion: 1600
        secureJsonData:
          password: $DB_PASSWORD
  # says "load every dashboard file from /etc/grafana/dashboards"
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: atp
        type: file
        options:
          path: /etc/grafana/dashboards
---
# the dashboard itself, written in grafana's own json format
# every panel is one SQL query, $player and $opponent are the two dropdowns at the top
