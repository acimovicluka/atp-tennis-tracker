            ]
          }
        },
        {
          "id": 6,
          "type": "barchart",
          "title": "Wins and losses by season",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT EXTRACT(YEAR FROM tourney_date)::int::text AS season, COUNT(*) FILTER (WHERE winner_id = '$player') AS wins, COUNT(*) FILTER (WHERE loser_id = '$player') AS losses FROM matches WHERE '$player' IN (winner_id, loser_id) GROUP BY season ORDER BY season"
