# grafana is a web page with charts, it has two dashboards:
# "ATP players" reads straight from the database, you pick a player from the dropdown at the top and every chart switches to him
# "ATP api" reads the numbers prometheus collects and shows how the api itself is doing
# this file has four things in it, split by ---

# a ConfigMap that tells grafana where its data comes from (datasources) and where to find the dashboards
# grafana reads these files by itself when it starts, this is called provisioning,
# so nobody has to click anything together in the grafana page, everything is in this file
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  # the database connection, grafana uses the same db Service as the api
  # grafana fills in $DB_USER, $DB_NAME and $DB_PASSWORD from its environment,
  # and the Deployment below takes them from the atp-db secret, so the password isn't written here
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: ATP database
        uid: atp-postgres
        type: grafana-postgresql-datasource
        url: db:5432
        user: $DB_USER
        isDefault: true
        jsonData:
          database: $DB_NAME
          sslmode: disable
          postgresVersion: 1600
        secureJsonData:
          password: $DB_PASSWORD
      # the second datasource is prometheus (k8s/prometheus.yaml), with the numbers about how the api is doing
      - name: Prometheus
        uid: atp-prometheus
        type: prometheus
        url: http://prometheus:9090
  # this tells grafana to load every dashboard file it finds in /etc/grafana/dashboards
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: atp
        type: file
        options:
          path: /etc/grafana/dashboards
---
# a ConfigMap with the dashboards themselves, written in grafana's own json format
# in the players dashboard every panel is one sql query, mostly the same sql as in api.py
# $player and $opponent are the two dropdowns at the top, grafana swaps them for the ids you picked
# every panel also has a description, it shows up when you hover over the little i next to its title
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  players.json: |
    {
      "uid": "atp-players",
      "title": "ATP players",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-5y",
        "to": "now"
      },
      "timepicker": {
        "hidden": true
      },
      "refresh": "",
      "tags": [
        "atp"
      ],
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "player",
            "label": "Player",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "atp-postgres"
            },
            "query": "SELECT player_id AS __value, name AS __text FROM players ORDER BY name",
            "definition": "SELECT player_id AS __value, name AS __text FROM players ORDER BY name",
            "refresh": 1,
            "current": {
              "text": "Jannik Sinner",
              "value": "S0AG",
              "selected": true
            },
            "options": [],
            "includeAll": false,
            "multi": false,
            "sort": 0,
            "hide": 0
