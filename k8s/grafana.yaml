          {
            "type": "query",
            "name": "opponent",
            "label": "Opponent",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "atp-postgres"
            },
            "query": "SELECT player_id AS __value, name AS __text FROM players ORDER BY name",
            "definition": "SELECT player_id AS __value, name AS __text FROM players ORDER BY name",
            "refresh": 1,
            "current": {
              "text": "Carlos Alcaraz",
              "value": "A0E2",
              "selected": true
            },
            "options": [],
            "includeAll": false,
            "multi": false,
            "sort": 0,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Wins",
          "description": "Every match the player won since 2022, Davis Cup and qualifying included, walkovers left out like in official ATP stats",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COUNT(*) AS wins FROM played_matches WHERE winner_id = '$player'"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Losses",
          "description": "Every match the player lost since 2022, walkovers left out",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COUNT(*) AS losses FROM played_matches WHERE loser_id = '$player'"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Win rate",
          "description": "Wins out of all matches played, in percent",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE winner_id = '$player') / NULLIF(COUNT(*), 0), 1) AS win_rate FROM played_matches WHERE '$player' IN (winner_id, loser_id)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Wins in the last 10 matches",
          "description": "Current form, the same 10 matches as the table below",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COUNT(*) FILTER (WHERE winner_id = '$player') AS last_10_wins FROM (SELECT winner_id FROM played_matches WHERE '$player' IN (winner_id, loser_id) ORDER BY tourney_date DESC, match_num DESC LIMIT 10) last_ten"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "barchart",
          "title": "Wins and losses by surface",
          "description": "Same numbers as /players/{id}/surface-stats in the api",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT surface, COUNT(*) FILTER (WHERE winner_id = '$player') AS wins, COUNT(*) FILTER (WHERE loser_id = '$player') AS losses FROM played_matches WHERE '$player' IN (winner_id, loser_id) AND surface IS NOT NULL GROUP BY surface ORDER BY surface"
            }
          ],
          "options": {
            "xField": "surface",
            "orientation": "auto",
            "showValue": "always",
            "groupWidth": 0.7,
            "barWidth": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "wins"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "losses"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 6,
          "type": "barchart",
          "title": "Wins and losses by season",
          "description": "One pair of bars per year, the current season is still going",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT EXTRACT(YEAR FROM tourney_date)::int::text AS season, COUNT(*) FILTER (WHERE winner_id = '$player') AS wins, COUNT(*) FILTER (WHERE loser_id = '$player') AS losses FROM played_matches WHERE '$player' IN (winner_id, loser_id) GROUP BY season ORDER BY season"
            }
          ],
          "options": {
            "xField": "season",
            "orientation": "auto",
            "showValue": "always",
            "groupWidth": 0.7,
            "barWidth": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "wins"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "losses"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Last 10 matches",
          "description": "Newest first, same as /players/{id}/form in the api",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT to_char(m.tourney_date, 'YYYY-MM-DD') AS date, m.tourney_name AS tournament, m.surface, m.round, CASE WHEN m.winner_id = '$player' THEN 'W' ELSE 'L' END AS result, opp.name AS opponent, m.score FROM played_matches m JOIN players opp ON opp.player_id = CASE WHEN m.winner_id = '$player' THEN m.loser_id ELSE m.winner_id END WHERE '$player' IN (m.winner_id, m.loser_id) ORDER BY m.tourney_date DESC, m.match_num DESC LIMIT 10"
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Head to head: ${player:text} vs ${opponent:text}",
          "description": "Wins of each player against the other, pick the opponent in the dropdown at the top",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT COUNT(*) FILTER (WHERE winner_id = '$player') AS \"${player:text}\", COUNT(*) FILTER (WHERE winner_id = '$opponent') AS \"${opponent:text}\" FROM played_matches WHERE (winner_id = '$player' AND loser_id = '$opponent') OR (winner_id = '$opponent' AND loser_id = '$player')"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Head to head matches",
          "description": "Every match between the two players, newest first, same as /h2h in the api",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "atp-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "atp-postgres"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT to_char(m.tourney_date, 'YYYY-MM-DD') AS date, m.tourney_name AS tournament, m.surface, m.round, w.name AS winner, m.score FROM played_matches m JOIN players w ON w.player_id = m.winner_id WHERE (m.winner_id = '$player' AND m.loser_id = '$opponent') OR (m.winner_id = '$opponent' AND m.loser_id = '$player') ORDER BY m.tourney_date DESC, m.match_num DESC"
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ],
      "annotations": {
        "list": []
      }
    }
  # the second dashboard shows how the api itself is doing: is it up, how many requests, how many errors, how fast
  # its panels ask prometheus (in promql, prometheus' own query language) instead of the database
  api.json: |
    {
      "uid": "atp-api",
      "title": "ATP api",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "atp"
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "API is up",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "atp-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "atp-prometheus"
              },
              "expr": "up{job=\"api\"}",
              "legendFormat": "api"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests in the last hour",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "atp-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "atp-prometheus"
              },
              "expr": "round(sum(increase(http_requests_total[1h])))",
              "legendFormat": "requests"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Errors (5xx) in the last hour",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "atp-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "atp-prometheus"
              },
              "expr": "round(sum(increase(http_requests_total{status=\"5xx\"}[1h])) or vector(0))",
              "legendFormat": "errors"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Slowest 5% of requests take at least",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "atp-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "atp-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests per second, by endpoint",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "atp-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "atp-prometheus"
              },
              "expr": "sum by (handler) (rate(http_requests_total[1m]))",
              "legendFormat": "{{handler}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Response time by endpoint (95th percentile)",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "atp-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "atp-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{handler}}"
            }
          ],
