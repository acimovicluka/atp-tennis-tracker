---
# a Deployment that runs grafana and keeps it running, the same way api.yaml runs the api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      enableServiceLinks: false   # same as in api.yaml, keeps kubernetes from adding DB_PORT=tcp://...
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - containerPort: 3000
          env:
            # these two let anyone who opens the page look at the charts without logging in (as a Viewer), but not change them
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # grafana opens the players dashboard right away, instead of its own welcome page
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/players.json
            # the admin login is the user admin with the database password, I only need it to edit a dashboard
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_PASSWORD
            # grafana puts these three into datasources.yaml above, so it can log into the database
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atp-db
                  key: DB_PASSWORD
          # grafana has its own health address, kubernetes uses it the same way it uses /ready on the api
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            # kubernetes puts the two provisioning files exactly where grafana looks for them when it starts
            # subPath takes only one file out of the ConfigMap, instead of the whole thing as a folder
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/atp.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/atp.yaml
              subPath: dashboards.yaml
            # and the two dashboard json files go into the folder dashboards.yaml points to
            - name: dashboard
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
# the Service is the address of grafana, on port 3000, the same way the api is on 8000
# on k3s (aws) that's http://<ip>:3000, on docker desktop I reach it with kubectl port-forward
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
