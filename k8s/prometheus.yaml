# prometheus collects numbers about the api over time (how many requests, how many errors, how fast)
# every 15 seconds it opens http://api:8000/metrics and saves what it finds there (this is called scraping)
# grafana then reads those numbers from prometheus and draws the charts in the "ATP api" dashboard
# this file has three things in it, split by ---

# a ConfigMap with the prometheus settings file: what prometheus reads and how often
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s          # how often prometheus asks the api for new numbers
    scrape_configs:
      - job_name: api               # the name prometheus gives these numbers, grafana uses it in its queries
        static_configs:
          - targets: ["api:8000"]   # the api Service, prometheus reads /metrics there by default
---
# a Deployment that runs prometheus and keeps it running
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml   # the settings file from the ConfigMap above
            - --storage.tsdb.path=/prometheus                # where prometheus saves the numbers
            - --storage.tsdb.retention.time=7d   # prometheus keeps one week of numbers and deletes anything older
          ports:
            - containerPort: 9090
          # prometheus has its own ready address, kubernetes uses it the same way it uses /ready on the api
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # prometheus keeps the numbers in an emptyDir, a folder that only lives as long as the pod does
            # if kubernetes replaces the pod the history starts over, and that's fine for this project
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
# the Service is the address of prometheus inside the cluster
# there's no LoadBalancer here: only grafana needs to reach prometheus,
# so it stays closed to the outside, like the database
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
